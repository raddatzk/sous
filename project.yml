name: Sous
options:
  bundleIdPrefix: com.raddatz
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SousKit:
    path: SousKit

targets:
  Sous:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sous
    entitlements:
      path: Sous/Supporting/Sous.entitlements
    dependencies:
      - package: SousKit
        product: SousKit
      - target: SousShare
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raddatz.sous
        PRODUCT_NAME: Sous
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Sous
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  SousShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SousShare
    entitlements:
      path: SousShare/SousShare.entitlements
    dependencies:
      - package: SousKit
        product: SousKit
    info:
      path: SousShare/Info.plist
      properties:
        CFBundleDisplayName: Sous
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raddatz.sous.share
        PRODUCT_NAME: SousShare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
