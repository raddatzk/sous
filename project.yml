name: Sous
options:
  bundleIdPrefix: me.raddatz
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.5"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SousKit:
    path: SousKit

# Declared so xcodegen generates them: without this it deletes the shared
# scheme files on every regeneration, and a project without its schemes
# looks in Xcode as if the targets themselves were gone.
schemes:
  Sous:
    build:
      targets:
        Sous: all
    run:
      config: Debug
    archive:
      config: Release
  SousShare:
    build:
      targets:
        SousShare: all
    run:
      config: Debug
  SousWidgets:
    build:
      targets:
        SousWidgets: all
    run:
      config: Debug

targets:
  Sous:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sous
    entitlements:
      path: Sous/Supporting/Sous.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
        # The household's rows are mirrored into this container. The identifier
        # has to exist in the developer account before a signed build can use
        # it; without it the store falls back to local-only rather than
        # refusing to open — see SousPersistentContainer.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.me.raddatz.sous
        com.apple.developer.icloud-services:
          - CloudKit
        # CloudKit tells the app about other devices' changes through a silent
        # push, and iOS only delivers those to an app entitled to receive
        # them. Without this the sync happens at launch and whenever the
        # framework next asks — which for a shared shopping list is far too
        # late. "development" for a debug build; the App Store build is
        # re-signed with the production value automatically.
        aps-environment: development
    info:
      path: Sous/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Sous
        LSApplicationCategoryType: public.app-category.food-and-drink
        # Without these two xcodegen writes its own defaults (1.0/1) into the
        # plist, and the plist wins over MARKETING_VERSION — the upload would
        # carry a different version than the project says.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # HTTPS only, so exempt from export compliance. Declared here so App
        # Store Connect stops asking on every single build.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # The iPad has to offer all four, or the upload is rejected outright:
        # a window that cannot rotate cannot be a multitasking window. The
        # phone stays upright, which is how a recipe is read while cooking
        # and the only orientation the layouts have been seen in.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without this, tapping an invitation link tells the invitee the app
        # does not support sharing — before any of our code runs.
        CKSharingSupported: true
        NSCalendarsFullAccessUsageDescription: >-
          Damit dein Essensplan als Termine in deinem Kalender steht.
          Sous schreibt nur in seinen eigenen Kalender.
        # How CloudKit says that another device changed something.
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: >-
          Damit ein Küchentimer klingelt, auch wenn das Gerät stumm
          geschaltet ist oder ein Fokus läuft.
        CFBundleURLTypes:
          - CFBundleURLName: me.raddatz.sous.import
            CFBundleURLSchemes: [sous]
    dependencies:
      - package: SousKit
        product: SousKit
      - target: SousShare
        platformFilter: iOS
      - target: SousWidgets
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous
        PRODUCT_NAME: Sous
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The Icon Composer file is `sous.icon`, so the compiler has to be
        # told that name — with the default "AppIcon" the pngs still land in
        # the bundle, but Info.plist never gets its CFBundleIcons entry and
        # the home screen shows a blank tile. Set here so a regeneration
        # cannot lose it again.
        ASSETCATALOG_COMPILER_APPICON_NAME: sous
        # The Mac demands what iOS has no notion of (the App Sandbox, without
        # which App Store Connect refuses the build) and rejects what iOS
        # requires (an app group without the team prefix). One shared file
        # cannot satisfy both, so the Mac gets its own.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Sous/Supporting/Sous-macOS.entitlements
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES

  SousWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SousWidgets
      # The alarm's metadata, shared with the app rather than redeclared:
      # both sides have to agree on it or the activity will not decode.
      - path: Sous/Timers/CookTimerMetadata.swift
      # The palette, so the lock screen is the same orange as the app.
      - path: Sous/Views/SousStyle.swift
    entitlements:
      path: SousWidgets/SousWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
    info:
      path: SousWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sous
        # An extension whose version differs from the app it ships inside is
        # rejected at upload, so both read the same setting.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous.widgets
        PRODUCT_NAME: SousWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES

  SousShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SousShare
      # The editor and what it draws with, shared with the app rather than
      # rebuilt: a recipe off the web is checked in the same screen it would
      # be edited in later.
      - path: Sous/Views/RecipeEditorView.swift
      - path: Sous/Views/CategoryField.swift
      - path: Sous/Views/AmountReviewSheet.swift
      - path: Sous/Views/RecipeImageView.swift
      - path: Sous/Views/RecipePickerView.swift
      - path: Sous/Views/RecipeRow.swift
      - path: Sous/Views/FlowLayout.swift
      - path: Sous/Views/SousStyle.swift
      - path: Sous/Views/SousAppearance.swift
      - path: Sous/Views/IngredientCatalogView.swift
      - path: Sous/Views/IngredientLineView.swift
      - path: Sous/Views/HighlightedTextEditor.swift
      - path: Sous/Views/RecipeLinkChips.swift
      - path: Sous/Views/RecipeTextEditorStyles.swift
      - path: Sous/Views/UnknownIngredientButton.swift
      - path: Sous/Views/IngredientAliasPickerView.swift
      - path: Sous/Views/IngredientParentPickerView.swift
      - path: Sous/Views/BLSRow.swift
      - path: Sous/Views/SousDialogs.swift
      - path: Sous/Views/DecimalText.swift
    entitlements:
      path: SousShare/SousShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
        com.apple.developer.icloud-container-identifiers:
          - iCloud.me.raddatz.sous
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: SousKit
        product: SousKit
    info:
      path: SousShare/Info.plist
      properties:
        CFBundleDisplayName: Sous
        # An extension whose version differs from the app it ships inside is
        # rejected at upload, so both read the same setting.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous.share
        PRODUCT_NAME: SousShare
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
