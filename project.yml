name: Sous
options:
  bundleIdPrefix: me.raddatz
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SousKit:
    path: SousKit

targets:
  Sous:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sous
    entitlements:
      path: Sous/Supporting/Sous.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
    info:
      path: Sous/Supporting/Info.plist
      properties:
        CFBundleDisplayName: Sous
        LSApplicationCategoryType: public.app-category.food-and-drink
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: >-
          Damit ein Küchentimer klingelt, auch wenn das Gerät stumm
          geschaltet ist oder ein Fokus läuft.
        CFBundleURLTypes:
          - CFBundleURLName: me.raddatz.sous.import
            CFBundleURLSchemes: [sous]
    dependencies:
      - package: SousKit
        product: SousKit
      - target: SousShare
        platformFilter: iOS
      - target: SousWidgets
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous
        PRODUCT_NAME: Sous
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES

  SousWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SousWidgets
      # The alarm's metadata, shared with the app rather than redeclared:
      # both sides have to agree on it or the activity will not decode.
      - path: Sous/Timers/CookTimerMetadata.swift
      # The palette, so the lock screen is the same orange as the app.
      - path: Sous/Views/SousStyle.swift
    entitlements:
      path: SousWidgets/SousWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
    info:
      path: SousWidgets/Info.plist
      properties:
        CFBundleDisplayName: Sous
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous.widgets
        PRODUCT_NAME: SousWidgets
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES

  SousShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: SousShare
      # The editor and what it draws with, shared with the app rather than
      # rebuilt: a recipe off the web is checked in the same screen it would
      # be edited in later.
      - path: Sous/Views/RecipeEditorView.swift
      - path: Sous/Views/AmountReviewSheet.swift
      - path: Sous/Views/RecipeImageView.swift
      - path: Sous/Views/RecipePickerView.swift
      - path: Sous/Views/RecipeRow.swift
      - path: Sous/Views/FlowLayout.swift
      - path: Sous/Views/SousStyle.swift
      - path: Sous/Views/SousAppearance.swift
      - path: Sous/Views/IngredientCatalogView.swift
      - path: Sous/Views/IngredientLineView.swift
      - path: Sous/Views/HighlightedTextEditor.swift
      - path: Sous/Views/RecipeTextEditorStyles.swift
      - path: Sous/Views/UnknownIngredientButton.swift
      - path: Sous/Views/IngredientAliasPickerView.swift
      - path: Sous/Views/DecimalText.swift
    entitlements:
      path: SousShare/SousShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.raddatz.sous
    dependencies:
      - package: SousKit
        product: SousKit
    info:
      path: SousShare/Info.plist
      properties:
        CFBundleDisplayName: Sous
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.raddatz.sous.share
        PRODUCT_NAME: SousShare
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MDQY93XVHF
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
