          note: Ein Päckchen Trockenhefe.
      nutrition:
        unspecified: [R458000]
      via: Erbte bisher „Backhefe frisch“ mit 128 kcal; getrocknet sind es 334. Das BLS nennt
        sie „Backhefe getrocknet (Trockenbackhefe)“ — kein Küchenwort steckt in diesem Namen,
        deshalb hat keine Suche sie je erreicht.
