  varieties:
    - id: getrockneter-dill
      name: Getrockneter Dill
      aliases:
        - Dill getrocknet
        - getrocknete Dillspitzen
      category: spices
      nutrition:
        unspecified:
          - code: Z-getrockneter-dill
            source:
              id: usda-sr-legacy
              ref: '171322'
      via: Getrocknet ist es ein anderes Produkt (Gewürzregal) mit einem Vielfachen der Werte
        je Gramm. USDA FoodData Central (SR Legacy, gemeinfrei) führt es als „Spices, dill
        weed, dried“, inline übernommen. USDA gibt Kohlenhydrate nur „by difference“ einschließlich
        Ballaststoffen an, das BLS ohne — deshalb fehlen sie in dieser Zeile.
