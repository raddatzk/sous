- id: tempeh
  name: Tempeh
  category: plantBased
  nutrition:
    cooked:
      - code: Z-tempeh-cooked
        source:
          id: usda-sr-legacy
          ref: '172467'
  via: Das BLS führt kein Tempeh. Ciqual (20917) und USDA (174272) heißen beide schlicht "Tempeh"
    – ein Ergänzungsname darf aber nie selbst zum Küchenwort werden. Deshalb nur die gegarte
    Zeile, USDA SR Legacy "Tempeh, cooked" (FDC 172467); Tempeh wird ohnehin gebraten. USDA
    nennt Kohlenhydrate nur als Differenz (mit Ballaststoffen); carbsG ist deshalb weggelassen.
