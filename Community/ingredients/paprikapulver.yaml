      name: Geräuchertes Paprikapulver
      aliases:
        - Paprikapulver geräuchert
        - Räucherpaprika
        - Pimentón de la Vera
    - id: scharfes-paprikapulver
      name: Scharfes Paprikapulver
      aliases:
        - Paprikapulver scharf
        - Paprikapulver rosenscharf
        - Rosenpaprika
