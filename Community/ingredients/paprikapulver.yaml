- id: paprikapulver
  name: Paprikapulver
  aliases:
    - Paprika edelsüß
    - Paprikapulver edelsüß
  category: spices
  nutrition:
    unspecified:
      - code: Z-paprikapulver
        source:
          id: usda-sr-legacy
          ref: '171329'
  via: Das BLS führt Paprikapulver nicht — in allen 7.140 Zeilen keine Entsprechung. Ciqual
    2020 führt es unter dem Namen „Paprika“, der hier schon das Gemüse ist (ein Ergänzungsname
    wird nie ein Küchenwort); USDA FoodData Central (SR Legacy, gemeinfrei) führt es als „Spices,
    paprika“, inline übernommen. USDA gibt Kohlenhydrate nur „by difference“ einschließlich
    Ballaststoffen an, das BLS ohne — deshalb fehlen sie in dieser Zeile. „Rosenpaprika“ war
    bis zu dieser Runde eine Schreibweise des edelsüßen Pulvers; die ungarische Sorte ist
    die schärfere und steht deshalb beim scharfen.
  varieties:
