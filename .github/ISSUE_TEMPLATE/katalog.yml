name: Vorschlag für den Zutatenkatalog
description: Was Sous ohne iCloud-Konto teilt — eigene Angaben eines Haushalts für den Katalog.
title: "Katalog: "
labels: ["katalog"]
body:
  - type: markdown
    attributes:
      value: |
        Sous füllt dieses Formular selbst aus („Anpassungen teilen“ ohne iCloud-Konto).
        Es ist öffentlich lesbar. Bitte nichts eintragen, was du nicht öffentlich sehen willst.
  - type: textarea
    id: meldung
    attributes:
      label: Meldung
      description: Die Vorschläge, wie Sous sie geschrieben hat, samt dem Block für die Maschine.
      render: markdown
    validations:
      required: true
