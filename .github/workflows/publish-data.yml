# Publishes the compiled data set to the app's CloudKit public database
# (INGREDIENTS-DATA §5; Scripts/data/README.md, "Publishing").
#
# A push to main that touches the data goes to development, where debug
# builds read it first, and then to production: the cook merges a
# data pull request, and the merge is the review. Production waits until
# development succeeded. By hand — Actions -> Publish data -> Run workflow —
# one environment at a time, for a retry or an emergency `--point-to`.
# publish.py holds the resources against Community/ itself before uploading, since
# a direct push publishes too.
#
# Each GitHub environment (`cloudkit-development`, `cloudkit-production`)
# holds its own server-to-server key as the secrets CLOUDKIT_KEY_ID and
# CLOUDKIT_PRIVATE_KEY (the PEM text). The key acts as the publisher's user
# record, which holds the CloudKit role `Publisher` in that environment.
name: Publish data

on:
  push:
    branches: [main]
    paths:
      - Community/**
      - SousKit/Sources/SousKit/Resources/*.json
      - Scripts/data/**
      - .github/workflows/publish-data.yml
  workflow_dispatch:
    inputs:
      environment:
        description: CloudKit environment
        type: choice
        options: [development, production]
        default: development

# One publish at a time, and none cancelled halfway: the pointer moves only
# after its release is complete, but a second run racing the first could move
# it back.
concurrency:
  group: publish-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What the app bundles is what main holds; a branch never publishes. A push
  # goes to development, then to production once development succeeded; a
  # dispatch goes to the one environment it names. The two jobs are the same
  # but for the environment, whose secrets hold that environment's key.
  development:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.environment == 'development')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudkit-development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/data/requirements.txt

      - name: Install the compiler's and the publisher's dependencies
        run: pip install -r Scripts/data/requirements.txt

      - name: Resources and manifest equal compile(Community/)
        run: python3 Scripts/data/compile.py --check

      - name: Publish the release, then move the pointer
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: python3 Scripts/data/publish.py --environment development --commit "$GITHUB_SHA"

  production:
    needs: development
    # `always()` so a dispatch for production runs although development was
    # skipped; a push still needs development to have succeeded.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.development.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudkit-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/data/requirements.txt

      - name: Install the compiler's and the publisher's dependencies
        run: pip install -r Scripts/data/requirements.txt

      - name: Resources and manifest equal compile(Community/)
        run: python3 Scripts/data/compile.py --check

      - name: Publish the release, then move the pointer
        env:
          CLOUDKIT_KEY_ID: ${{ secrets.CLOUDKIT_KEY_ID }}
          CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
        run: python3 Scripts/data/publish.py --environment production --commit "$GITHUB_SHA"
