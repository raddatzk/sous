name: Release to TestFlight

# Run it by hand for every TestFlight build: Actions -> Release to TestFlight
# -> Run workflow. The version is <major>.<commits on main>, with the major
# number from MARKETING_VERSION in project.yml, so every new state of main is a
# new, higher version on its own and the iOS and the macOS build of the same
# state carry the same version. The build is 10 × run number + attempt, unique
# even when the same state is uploaded twice or a run is re-run. Every new
# version goes through a Beta App Review before external testers get it;
# internal testers do not wait.
#
# After a successful upload the tag job marks the commit as v<version>.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    # GitHub-hosted, like CI. Only a manual dispatch starts this job, and
    # secrets are never handed to a workflow triggered from a fork, so the
    # signing material stays out of reach of anyone opening a pull request.
    runs-on: macos-26
    timeout-minutes: 120

    outputs:
      version: ${{ steps.version.outputs.marketing }}

    env:
      # Not a secret: it is in project.yml and in every built binary.
      TEAM_ID: MDQY93XVHF

    steps:
      # The whole history: the version counts the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old — the project targets iOS 26.5 and needs Xcode 26 or newer."
            exit 1
          fi

      - name: Work out the version
        id: version
        run: |
          marketing=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)
          major="${marketing%%.*}"
          if [ -z "$major" ]; then
            echo "::error::No MARKETING_VERSION found in project.yml."
            exit 1
          fi

          # A shallow clone would count one commit and ship 1.1 forever.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::error::The checkout is shallow; the version needs the full history (fetch-depth: 0)."
            exit 1
          fi
          # Only ever grows, unless main's history is rewritten — App Store
          # Connect would then reject the lower version.
          version="$major.$(git rev-list --count HEAD)"

          # Unique within the version even when the same state is uploaded
          # twice, and for up to nine attempts of one run.
          build=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))

          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Shipping $version (build $build)"

      # A keychain of its own, thrown away at the end. Importing into the
      # login keychain would leave the signing identity on a machine that is
      # recycled anyway, and would prompt.
      # Three of them: "Apple Distribution" signs the apps on both platforms,
      # and "3rd Party Mac Developer Installer" signs the .pkg that a Mac App
      # Store submission actually is. The app certificate cannot do the
      # second job, and without it the macOS export fails at the very end.
      # "Apple Development" signs nothing that ships, but automatic signing
      # archives with a development identity and only re-signs for distribution
      # on export — so a hosted runner without one makes
      # -allowProvisioningUpdates mint a fresh development certificate on every
      # run, until the account hits Apple's limit and every later run fails.
      # That is what drove this job onto a self-hosted Mac once; a certificate
      # it can reuse solves it for one secret.
      - name: Install the signing certificates
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          import_p12() {
            echo "$2" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" \
              -k "$keychain" -P "$3" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm "$RUNNER_TEMP/cert.p12"
            echo "imported $1"
          }

          import_p12 "Apple Distribution" "$DIST_CERT_P12" "$DIST_CERT_PASSWORD"
          import_p12 "Mac Installer Distribution" "$MAC_INSTALLER_P12" "$MAC_INSTALLER_PASSWORD"
          import_p12 "Apple Development" "$DEV_CERT_P12" "$DEV_CERT_PASSWORD"

          # Say what actually landed, so a wrong or key-less .p12 is caught
          # here rather than forty minutes later in the export step. Printing
          # is not enough: `find-identity` reports "0 valid identities found"
          # and still exits 0, so the count has to be asserted. The installer
          # certificate is not a code-signing identity and needs its own
          # policy to be listed.
          security find-identity -v "$keychain"
          for kind in "Apple Distribution" "Apple Development"; do
            if ! security find-identity -v "$keychain" | grep -q "$kind"; then
              echo "::error::No $kind identity in the keychain — the matching" \
                   "secret is not a .p12 containing both certificate and private key."
              exit 1
            fi
          done
          security find-identity -v -p basic "$keychain" | grep -q "3rd Party Mac Developer Installer" || {
            echo "::error::No 3rd Party Mac Developer Installer identity in the keychain —" \
                 "MAC_INSTALLER_P12 is not a .p12 containing both certificate and private key."
            exit 1
          }

          # Without this codesign stops to ask for permission it cannot get.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null

          # Put it in the search list, or xcodebuild will not look in it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # xcodebuild uses this to fetch and, if need be, create the provisioning
      # profiles for all three bundle IDs, and to do the upload at the end.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      # An upload needs an app record in App Store Connect; without one the
      # export step fails with "Error Downloading App Information", which names
      # neither the app nor the reason. Ask first, and say what was found.
      # Never fatal: this is a diagnosis, and `--list-apps` is not worth a
      # failed release of its own.
      - name: Check the app exists in App Store Connect
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          bundle_id=$(sed -n 's/^ *PRODUCT_BUNDLE_IDENTIFIER: *\(.*\)$/\1/p' project.yml | head -1)
          echo "Looking for $bundle_id"
          apps=$(xcrun altool --list-apps --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
          echo "$apps"
          if ! printf '%s' "$apps" | grep -qF "$bundle_id"; then
            echo "::warning::$bundle_id is not among the apps this key can see." \
                 "Create the app record in App Store Connect, or check the key is App Manager."
          fi

      - name: Generate the project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      # Uploading straight from the export step, so no separate altool call
      # and no intermediate .ipa or .pkg to keep track of.
      - name: Write the export options
        run: |
          for platform in iOS macOS; do
            cat > "$RUNNER_TEMP/ExportOptions-$platform.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          $( [ "$platform" = macOS ] && printf '%s' '<key>installerSigningCertificate</key>
            <string>3rd Party Mac Developer Installer</string>' )
          </dict>
          </plist>
          PLIST
          done

      # Both platforms are archived before either is uploaded, so a macOS build
      # that does not compile leaves no lone iOS build of that version behind.
      - name: Archive
        run: |
          set -o pipefail
          for platform in iOS macOS; do
            xcodebuild archive \
              -scheme Sous \
              -destination "generic/platform=$platform" \
              -archivePath "$RUNNER_TEMP/Sous-$platform.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
              MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
              | xcbeautify --renderer github-actions
          done

      # The manifests are picked up implicitly, because they sit inside the
      # sources paths. Implicit means one can silently stop being copied, and
      # App Store Connect only complains by e-mail hours later. The extensions
      # are iOS-only; the Mac app keeps its manifest under Contents/Resources.
      - name: Check the privacy manifests made it into the bundles
        run: |
          ios="$RUNNER_TEMP/Sous-iOS.xcarchive/Products/Applications/Sous.app"
          mac="$RUNNER_TEMP/Sous-macOS.xcarchive/Products/Applications/Sous.app"
          missing=0
          for manifest in \
            "$ios/PrivacyInfo.xcprivacy" \
            "$ios/PlugIns/SousShare.appex/PrivacyInfo.xcprivacy" \
            "$ios/PlugIns/SousWidgets.appex/PrivacyInfo.xcprivacy" \
            "$mac/Contents/Resources/PrivacyInfo.xcprivacy"; do
            if [ ! -f "$manifest" ]; then
              echo "::error::${manifest#"$RUNNER_TEMP"/} is missing from the built app."
              missing=1
            else
              plutil -lint "$manifest"
            fi
          done
          exit $missing

      - name: Export and upload
        # `IDEDistribution` drops its log bundle in TMPDIR, which is a random
        # path under /var/folders. Point it somewhere known so the step below
        # can pick the logs up without searching the whole runner.
        env:
          TMPDIR: ${{ runner.temp }}/distlogs
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          for platform in iOS macOS; do
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Sous-$platform.xcarchive" \
              -exportPath "$RUNNER_TEMP/export-$platform" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-$platform.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
              | xcbeautify --renderer github-actions
          done

      # `xcodebuild` writes Apple's actual answer into an .xcdistributionlogs
      # bundle in a temporary directory and the runner takes it to the grave.
      # The step above only prints the one-line summary, which for a missing
      # app record is "Error Downloading App Information" and nothing else.
      - name: Keep the distribution logs when the upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcdistributionlogs
          path: ${{ runner.temp }}/distlogs/**/*.xcdistributionlogs/**
          if-no-files-found: warn
          retention-days: 7

      # Runs even when the archive failed, so a broken run leaves no identity
      # behind on the runner.
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/private_keys"

  tag:
    # Marks the commit that just went to TestFlight, so git shows what shipped
    # when. A job of its own: only these few lines hold a token that can write
    # to the repository, not the job running the build tools with the signing
    # material. A tag created with this token starts no workflow.
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.testflight.outputs.version }}
        run: |
          # The same state uploaded again (a new build of the same version)
          # keeps its first tag instead of failing the run.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; left as it is."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG"
