name: Release to TestFlight

# Run it by hand for every TestFlight build: Actions -> Release to TestFlight
# -> Run workflow. The marketing version comes from project.yml and the build
# number from the run number, so repeated runs are new builds of the same
# version — which is what external TestFlight wants, since only a new version
# triggers another Beta App Review.
#
# A tag is optional and marks a release in git rather than driving it. Push
# one and the job checks it agrees with project.yml, so a forgotten version
# bump fails here instead of arriving in App Store Connect as the wrong one.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: self-hosted
    timeout-minutes: 90

    env:
      # Not a secret: it is in project.yml and in every built binary.
      TEAM_ID: MDQY93XVHF

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old — the project targets iOS 26.5 and needs Xcode 26 or newer."
            exit 1
          fi

      - name: Work out the version
        id: version
        run: |
          # One source of truth, the same one the Info.plist reads.
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' project.yml | head -1)
          if [ -z "$version" ]; then
            echo "::error::No MARKETING_VERSION found in project.yml."
            exit 1
          fi

          # `v1.0` is a tag; `1.0` is what CFBundleShortVersionString wants.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME says $tagged but project.yml says $version — bump one of them."
              exit 1
            fi
          fi

          echo "marketing=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Shipping $version (build ${{ github.run_number }})"

      # A keychain of its own, thrown away at the end. Importing into the
      # login keychain would leave the signing identity on a machine that is
      # recycled anyway, and would prompt.
      # Two of them: "Apple Distribution" signs the apps on both platforms,
      # and "3rd Party Mac Developer Installer" signs the .pkg that a Mac App
      # Store submission actually is. The app certificate cannot do the
      # second job, and without it the macOS export fails at the very end.
      - name: Install the signing certificates
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
          MAC_INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          import_p12() {
            echo "$2" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" \
              -k "$keychain" -P "$3" \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
            rm "$RUNNER_TEMP/cert.p12"
            echo "imported $1"
          }

          import_p12 "Apple Distribution" "$DIST_CERT_P12" "$DIST_CERT_PASSWORD"
          import_p12 "Mac Installer Distribution" "$MAC_INSTALLER_P12" "$MAC_INSTALLER_PASSWORD"

          # Say what actually landed, so a wrong or key-less .p12 is caught
          # here rather than forty minutes later in the export step.
          security find-identity -v "$keychain"

          # Without this codesign stops to ask for permission it cannot get.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null

          # Put it in the search list, or xcodebuild will not look in it.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # xcodebuild uses this to fetch and, if need be, create the provisioning
      # profiles for all three bundle IDs, and to do the upload at the end.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate the project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      # Uploading straight from the export step, so no separate altool call
      # and no intermediate .ipa to keep track of.
      - name: Write the export options
        run: |
          for platform in iOS macOS; do
            cat > "$RUNNER_TEMP/ExportOptions-$platform.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          $( [ "$platform" = macOS ] && printf '%s' '<key>installerSigningCertificate</key>
            <string>3rd Party Mac Developer Installer</string>' )
          </dict>
          </plist>
          PLIST
          done

      - name: Archive and upload
        run: |
          set -o pipefail
          for platform in iOS macOS; do
            archive="$RUNNER_TEMP/Sous-$platform.xcarchive"

            xcodebuild archive \
              -scheme Sous \
              -destination "generic/platform=$platform" \
              -archivePath "$archive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
              MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
              CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
              | xcbeautify --renderer github-actions

            xcodebuild -exportArchive \
              -archivePath "$archive" \
              -exportPath "$RUNNER_TEMP/export-$platform" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-$platform.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
              -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
              | xcbeautify --renderer github-actions
          done

      # Runs even when the archive failed, so a broken run leaves no identity
      # behind on the runner.
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -rf "$RUNNER_TEMP/private_keys"
