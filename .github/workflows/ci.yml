name: CI

# Every push to main and every pull request. Nothing here signs anything, so
# it needs no secrets and keeps running even if the certificates expire.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless. macOS
# minutes bill at ten times the rate of Linux, so cancel rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The catalog, in seconds and on Linux beside the Mac job: Data/ compiles,
  # passes its checks, and the bundled resources are exactly what it compiles
  # to. A data mistake fails here with a message that names the file.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/data/requirements.txt

      - name: Install the compiler's dependencies
        run: pip install -r Scripts/data/requirements.txt

      # `--check` compares every resource and manifest.json, whose hashes
      # name the data set's files. `--since` compares Data/released-ids.txt
      # with the base: the list only grows, and a line deleted together with
      # its entry would otherwise let an id vanish, or come back one day
      # meaning something else. It also wants a higher dataVersion whenever
      # the data changed since the base.
      - name: Resources and manifest equal compile(Data/), and no released id went missing
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$BASE"
            python3 Scripts/data/compile.py --check --since "$BASE"
          else
            python3 Scripts/data/compile.py --check
          fi

      - name: Test the compiler
        run: python3 -m unittest discover -s Scripts/data -p 'test_*.py' -v

  build:
    # GitHub-hosted, not a Mac of ours. This repository is public, so a pull
    # request can come from anyone, and a self-hosted runner would execute a
    # stranger's code as a real user on a real machine — home directory, ssh
    # keys, unlocked login keychain and all. Hosted runners are free for public
    # repositories and this job signs nothing, so there is nothing to gain by
    # using one.
    #
    # `xcode-27`, not `macos-26`: the app targets iOS 27, which needs the
    # iOS 27 SDK and so Xcode 27, and `macos-26` carries only Xcode 26. It is a
    # preview label; move to `macos-27` once GitHub ships that as GA.
    runs-on: xcode-27
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      # The image ships several Xcodes, betas among them, so "the newest"
      # would pick a beta. Take the image's default instead — GitHub points it
      # at the current release — and say out loud which one it was, because a
      # quiet move to an older Xcode would otherwise fail much later with a
      # confusing SDK error: the deployment target is iOS 27 (macOS 26.5).
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          major=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 27 ]; then
            echo "::error::Xcode $major is too old — the project targets iOS 27 and needs Xcode 27 or newer."
            exit 1
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('SousKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The .xcodeproj is checked in, but project.yml is the source of truth
      # and a stale pbxproj would test something other than what was pushed.
      - name: Generate the project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      # A change of the catalog alone — Data/, the compiled resources, the
      # scripts that compile and publish them — cannot break the apps' build,
      # but it can break the tests that read the bundled data (a word that was
      # an "unknown" example, the scorecard). So the tests always run, and
      # the two app builds, five of the job's seven minutes, only when
      # anything else changed. Steps, not jobs: the required check stays
      # `build`, and a skipped step still lets it pass.
      - name: Only the catalog changed?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "catalog_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          other=$(echo "$changed" | grep -vE '^(Data/|SousKit/Sources/SousKit/Resources/[^/]+\.json$|Scripts/data/)' || true)
          if [ -n "$changed" ] && [ -z "$other" ]; then
            echo "catalog_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Only the catalog changed: SousKit is tested, the apps are not built."
          else
            echo "catalog_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test SousKit
        working-directory: SousKit
        run: swift test

      # Simulator destination, so no signing identity is needed at all.
      - name: Build for iOS
        if: steps.scope.outputs.catalog_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Sous \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        shell: bash

      - name: Build for macOS
        if: steps.scope.outputs.catalog_only != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Sous \
            -destination 'platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        shell: bash
