changeNote: 'Von der Packung abgeschrieben, je Zeile mit Produkt, EAN und dem Tag, an dem sie gelesen wurde. Je 100 ml deklarierte Werte sind über die Dichte der Zutat auf 100 g umgerechnet; was das Etikett nicht deklariert, ist bei der Zeile vermerkt.'
