# What each data source says about itself: version, release, licence and the
# attribution it asks for. The rows themselves sit inline on their ingredient.
supplements:
  datasetVersion: sous Ergänzungen 1
  release: '2026-08-26'
  license: CC BY 4.0
  attribution: 'Ergänzungen zum Bundeslebensmittelschlüssel. Enthaltene Quellen: Table de
    composition nutritionnelle Ciqual 2020, Anses (Frankreich); Nährwertdeklarationen einzelner
    Handelsprodukte. Welche Zeile woher stammt, steht bei jeder Zutat unter „Quelle“. Die
    Lizenz gilt für die übernommenen Datenbankzeilen; eine Nährwertdeklaration ist eine Tatsachenangabe
    und trägt keine eigene Lizenz — genannt wird sie, damit man sie an der Dose nachprüfen
    kann.'
  changeNote: 'Lebensmittel, die der BLS 4.0 nicht führt. Jede Zeile nennt ihre eigene Quelle
    und ist von Hand übernommen, nicht importiert. Die Namen stehen so da, wie die Quelle
    sie schreibt — auch wenn das eine andere Sprache ist: ein übersetzter Name wäre in keiner
    Datenbank wiederzufinden. Eine Zeile darf auch von einer Nährwertdeklaration stammen,
    wenn keine Datenbank das Lebensmittel führt: dann nennt sie das Produkt mit EAN, und was
    das Etikett nicht deklariert, wird aus der nächstliegenden BLS-Zeile abgeleitet statt
    auf null gesetzt — der Decoder liest eine fehlende Angabe als 0, und das wäre eine Behauptung.
    Codes beginnen mit Z, einem Buchstaben, den der BLS in keiner Version vergibt (er kennt
    nur B–Y), und werden fortlaufend und nie erneut vergeben — eine gelöschte Zeile lässt
    ihre Nummer verfallen, damit gespeicherte Zuordnungen nicht auf ein anderes Lebensmittel
    umspringen.'
