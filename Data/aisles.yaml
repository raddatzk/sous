# BLS food groups — the first letter of an SBLS code — and the aisle (category)
# each one stands for, with what the group actually holds. Read by compile.py
# for aisles.json. A word's own category always wins; this is what a curator
# reaches for when filing a new word under a group, and the notes say where a
# group's foods belong when the group mixes kinds.
note: Default-Ladenbereich je BLS-Lebensmittelgruppe. Greift, wo eine Zeile oder ein Synonym
  keine eigene Kategorie mitbringt; die feinere Zuordnung je Zeile steht in nutrition.json.
letters:
  B:
    category: bakery
    note: Bread (Roggenvollkornbrot, Weizenbrot, Toastbrot, Baguette, Naan).
  C:
    category: grains
    note: Grains, flours, flakes, müsli and cornflakes, sweetened and fortified ones included.
  D:
    category: bakery
    note: Pastries and biscuits (Zwieback, Salzbrezeln, Butterkekse, Blätterteig).
  E:
    category: grains
    note: Pasta, noodles and dumplings (Teigwaren, Schupfnudeln, Semmelknödel, Ravioli) —
      and every egg (Hühnerei, Wachtelei, Eigelb, Eiklar), which belongs under dairy.
  F:
    category: fruit
    note: Fruit, raw and prepared.
  G:
    category: vegetables
    note: Vegetables, raw and prepared, some canned mixes and vegetable juice.
  H:
    category: legumes
    note: 'Legumes, sprouts and soy (beans, lentils, peas, tofu) — and much else that belongs
      elsewhere: nuts and seeds (nuts), olives and bamboo shoots (vegetables), coconut (fruit),
      plant drinks (drinks), plant-based dairy alternatives (dairy), meat substitutes (other),
      glass noodles (grains).'
  K:
    category: vegetables
    note: Potatoes, other tubers (Maniok, Batate, Topinambur) and edible mushrooms (vegetables);
      starches and their flours, gnocchi (grains); frozen and instant potato products.
  M:
    category: dairy
    note: Milk, yoghurt, cheese and cream in their fat contents and processing variants.
  N:
    category: drinks
    note: Ready-to-drink beverages — coffee, tea, soft drinks, juice drinks, water.
  P:
    category: drinks
    note: Alcoholic drinks — beer, wine by colour and dryness, fortified wines, spirits,
      liqueurs, cocktails.
  Q:
    category: oils
    note: Oils and fats — and the butters (Süßrahmbutter, Sauerrahmbutter, compound butters)
      and vegan cheese alternatives, which belong under dairy; bottled mayonnaise and remoulade.
  R:
    category: spices
    note: Salt, pepper, dried herbs and seasonings — and condiments, sauces, stock cubes and
      spreads (canned), vinegar (oils), baking aids such as leavening, gelatine, pectin, food
      acids and candied peel (baking), fresh ginger (vegetables), and pastry fillings and glazes.
  S:
    category: baking
    note: Sugars, honey, syrups, cocoa, jams, marzipan and baking chocolate (baking) — and,
      most of the group, finished confectionery and ice cream.
  T:
    category: fish
    note: Fish and seafood — fin fish, shellfish, crustaceans.
  U:
    category: meat
    note: Raw meat cuts across species.
  V:
    category: meat
    note: Poultry, game and offal.
  W:
    category: meat
    note: Sausages, cured meats and deli products (Salami, Schinken, Speck, Wurst).
  X:
    category: other
    note: Labelled broths, but mostly composed dishes — gratins, stews, soups, sauces, salads;
      its plain stocks (Hühnerbrühe, Gemüsebrühe, Fischbrühe) belong under canned.
  Y:
    category: other
    note: Composed dishes and desserts (Sauerbraten, Kaiserschmarrn, Frikadellen, puddings);
      Fleischbrühe (Rind) is its one plain stock, canned.
